services:

  oracle-db:
    image: container-registry.oracle.com/database/free:latest
    container_name: dbvc-oracle

    ports:
      - "1521:1521"
      - "5500:5500"

    environment:
      ORACLE_PWD: Oracle123
      ORACLE_CHARACTERSET: AL32UTF8

    volumes:
      - oracle-data:/opt/oracle/oradata

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "printf 'WHENEVER SQLERROR EXIT FAILURE\nWHENEVER OSERROR EXIT FAILURE\nSELECT 1 FROM dual;\nEXIT SUCCESS\n' | sqlplus -s 'sys/Oracle123@localhost:1521/FREEPDB1 as sysdba' > /dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped


  liquibase:
    image: liquibase/liquibase:5.0.2

    depends_on:
      oracle-db:
        condition: service_healthy

    volumes:
      - ./liquibase:/liquibase/project
      - ./drivers:/liquibase/drivers

    entrypoint: ["liquibase"]


  minio:
    image: minio/minio:latest
    container_name: dbvc-minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    volumes:
      - minio-data:/data

    command: server /data --console-address ":9001"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped


  backend:
    build:
      context: ./backend

    image: dbvc-backend:local
    container_name: dbvc-backend

    depends_on:
      oracle-db:
        condition: service_healthy

      minio:
        condition: service_started

    ports:
      - "8085:8085"

    environment:

      # Main DBVC platform database
      DBVC_DATASOURCE_URL: "jdbc:oracle:thin:@oracle-db:1521/FREEPDB1"

      # Managed environments
      DBVC_ENV_DEV_URL: "jdbc:oracle:thin:@oracle-db:1521/FREEPDB1"
      DBVC_ENV_TEST_URL: "jdbc:oracle:thin:@oracle-db:1521/FREEPDB1"
      DBVC_ENV_PROD_URL: "jdbc:oracle:thin:@oracle-db:1521/FREEPDB1"

      # Artifact storage
      DBVC_ARTIFACT_STORAGE_ENDPOINT: "http://minio:9000"

      # Liquibase execution inside backend container
      DBVC_LIQUIBASE_COMMAND_MODE: "direct"

      # Liquibase files inside backend container
      DBVC_LIQUIBASE_CHANGELOG_PATH: "/liquibase/project/changelog/db.changelog-master.sql"

      DBVC_LIQUIBASE_APPLICATION_CHANGELOG_PATH: "/liquibase/project/changelog/db.application-changelog-master.sql"

      DBVC_LIQUIBASE_GENERATED_CHANGELOG_DIRECTORY: "/liquibase/project/changelog/generated"

      # Working root used by MigrationExecutionService
      DBVC_PROJECT_ROOT: "/"

    volumes:
      - ./liquibase:/liquibase/project
      - ./drivers:/liquibase/drivers:ro

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8085/api/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped


volumes:
  oracle-data:
  minio-data: