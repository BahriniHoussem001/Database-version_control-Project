# =========================================================
# Application
# =========================================================

spring.application.name=backend

server.port=${SERVER_PORT:8085}


# =========================================================
# Main DBVC platform database
# =========================================================

spring.datasource.url=${DBVC_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DBVC_DATASOURCE_USERNAME:DBVC}
spring.datasource.password=${DBVC_DATASOURCE_PASSWORD:Dbvc123}
spring.datasource.driver-class-name=${DBVC_DATASOURCE_DRIVER:oracle.jdbc.OracleDriver}


# =========================================================
# JPA / Hibernate
# =========================================================

# Liquibase owns database schema changes.
# Hibernate must not automatically create or modify tables.
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never


# =========================================================
# DBVC project paths
# =========================================================

# Local default:
# backend runs from backend/, therefore project root is ..
#
# Docker:
# this will later be overridden with DBVC_PROJECT_ROOT
dbvc.project-root=${DBVC_PROJECT_ROOT:..}


# =========================================================
# Liquibase paths
# =========================================================

# Platform DBVC changelog
dbvc.liquibase.changelog-path=${DBVC_LIQUIBASE_CHANGELOG_PATH:../liquibase/changelog/db.changelog-master.sql}

# Historical application changelog used by validation/history logic
dbvc.liquibase.application-changelog-path=${DBVC_LIQUIBASE_APPLICATION_CHANGELOG_PATH:../liquibase/changelog/db.application-changelog-master.sql}

# Directory where Migration Builder creates new migration files
dbvc.liquibase.generated-changelog-directory=${DBVC_LIQUIBASE_GENERATED_CHANGELOG_DIRECTORY:../liquibase/changelog/generated}


# =========================================================
# Liquibase command execution mode
# =========================================================

# docker:
# Backend runs locally on Windows and executes:
# docker compose run --rm liquibase ...
#
# direct:
# Backend runs inside Docker and executes:
# liquibase ...
dbvc.liquibase.command-mode=${DBVC_LIQUIBASE_COMMAND_MODE:docker}


# =========================================================
# Migration execution worker
# =========================================================

dbvc.execution-worker.fixed-delay-ms=${DBVC_EXECUTION_WORKER_FIXED_DELAY_MS:10000}


# =========================================================
# Managed DEV environment
# =========================================================

dbvc.environment.dev.url=${DBVC_ENV_DEV_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
dbvc.environment.dev.username=${DBVC_ENV_DEV_USERNAME:DBVC_DEV}
dbvc.environment.dev.password=${DBVC_ENV_DEV_PASSWORD:Dev123}


# =========================================================
# Managed TEST environment
# =========================================================

dbvc.environment.test.url=${DBVC_ENV_TEST_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
dbvc.environment.test.username=${DBVC_ENV_TEST_USERNAME:DBVC_TEST}
dbvc.environment.test.password=${DBVC_ENV_TEST_PASSWORD:Test123}


# =========================================================
# Managed PROD environment
# =========================================================

dbvc.environment.prod.url=${DBVC_ENV_PROD_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
dbvc.environment.prod.username=${DBVC_ENV_PROD_USERNAME:DBVC_PROD}
dbvc.environment.prod.password=${DBVC_ENV_PROD_PASSWORD:Prod123}


# =========================================================
# JWT authentication
# =========================================================

dbvc.jwt.secret=${DBVC_JWT_SECRET:change-this-local-development-secret-key-please-keep-it-long}
dbvc.jwt.issuer=${DBVC_JWT_ISSUER:dbvc-platform}
dbvc.jwt.expiration-minutes=${DBVC_JWT_EXPIRATION_MINUTES:480}


# =========================================================
# Default admin account
# =========================================================

dbvc.auth.default-admin-username=${DBVC_AUTH_DEFAULT_ADMIN_USERNAME:admin}
dbvc.auth.default-admin-password=${DBVC_AUTH_DEFAULT_ADMIN_PASSWORD:Admin123!}


# =========================================================
# Artifact storage
# Local: MinIO
# Cloud: S3 / S3-compatible storage
# =========================================================

dbvc.artifact-storage.enabled=${DBVC_ARTIFACT_STORAGE_ENABLED:true}

dbvc.artifact-storage.provider=${DBVC_ARTIFACT_STORAGE_PROVIDER:minio}

dbvc.artifact-storage.endpoint=${DBVC_ARTIFACT_STORAGE_ENDPOINT:http://localhost:9000}

dbvc.artifact-storage.region=${DBVC_ARTIFACT_STORAGE_REGION:us-east-1}

dbvc.artifact-storage.bucket=${DBVC_ARTIFACT_STORAGE_BUCKET:dbvc-artifacts}


# =========================================================
# Artifact storage credentials
# =========================================================

# static:
# Uses access key + secret key.
# Used locally with MinIO or with S3-compatible providers.
#
# default:
# Uses the AWS default credential chain.
# later when using an AWS IAM Role.
dbvc.artifact-storage.credentials-mode=${DBVC_ARTIFACT_STORAGE_CREDENTIALS_MODE:static}

dbvc.artifact-storage.access-key=${DBVC_ARTIFACT_STORAGE_ACCESS_KEY:minioadmin}

dbvc.artifact-storage.secret-key=${DBVC_ARTIFACT_STORAGE_SECRET_KEY:minioadmin}

dbvc.artifact-storage.path-style-access=${DBVC_ARTIFACT_STORAGE_PATH_STYLE_ACCESS:true}